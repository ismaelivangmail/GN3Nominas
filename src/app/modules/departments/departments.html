<div class="row mt-3">
    <button class="btn  col-auto ms-auto" type="button" (click)="dialogAddDepartment();"><i
            class="bi bi-plus-circle-fill mright"></i>Agregar Departamento</button>
</div>
@if (showdialog) {
<div class="row mt-3">

    <div class="col-md-1">
        <label for="txtDeptId" class="from-label">CLAVE</label>
        <input type="text" name="id" id="txtDeptId" class="form-control" [(ngModel)]="Department_.DeptId" disabled="true">
    </div>
    <div class="col-md-4">
        <label for="txtFullName" class="from-label">DEPARTAMENTO</label>
        <input type="text" name="id" id="txtDeptDesc" class="form-control" [(ngModel)]="Department_.DeptDesc">
    </div>
</div>
<div class="row mt-5">
    <div class="col">
        <button class="btn btn-success" type="button" (click)="onAddDepartment(Department_)">Agregar</button>
        <!--
      <button class="btn btn-warning m-2" type="button" (click)="onUpdateDepartment(Department_)">Modificar</button>
      <button class="btn btn-danger" type="button" (click)="onDeleteDepartment(Department_.DeptId)">Eliminar</button>
      <button class="btn btn-primary m-2" type="button" (click)="clear()">Limpiar</button>-->
        <button class="btn btn-primary m-2" type="button" (click)="showdialog=false;clear();">Cancelar</button>
    </div>

</div>
}
<div class="row mt-3">
    <div class="col">

        <table class="table table-bordered align-middle">
            <thead class="table-light">
                <tr>

                    <th>CLAVE</th>
                    <th>DEPARTAMENTO</th>
                    <th>ACCIONES</th>
                </tr>
            </thead>
            <tbody>
                @for (item of datatable(); track item.DeptId) {
                <tr>
                    <td>{{ item.DeptId }}</td>
                    <td>
                        @if (editing === item.DeptId) {
                        <input type="text" class="form-control" [(ngModel)]="editRow.DeptDesc" />
                        } @else {
                        {{ item.DeptDesc }}
                        }
                    </td>
                  
                    <td>
                        @if (editing === item.DeptId) {
                        <button class="btn btn-success btn-sm me-1" (click)="onSave()">
                            Guardar
                        </button>
                        <button class="btn btn-secondary btn-sm" (click)="onCancel()">
                            Cancelar
                        </button>
                        } @else {
                        <button class="btn btn-warning btn-sm me-1" (click)="onEdit(item)">
                            Editar
                        </button>
                        <button class="btn btn-danger btn-sm" (click)="onDelete(item.DeptId)">
                            Eliminar
                        </button>
                        }
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="4" class="text-center">No hay registros disponibles.</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
